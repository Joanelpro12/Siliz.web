<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SILIZ | Contacto</title>
  <link rel="stylesheet" href="Css/Liz.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="stars"></div>

  <header>
    <div class="logo">SILIZ</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="empresa.html">Empresa</a>
      <a href="servicio.html">Servicios</a>
      <a href="contacto.html" class="active">Contacto</a>
    </nav>
  </header>

  <div class="page-header">
    <span class="page-eyebrow">Hablemos</span>
    <h2>Contáctanos</h2>
  </div>

  <section class="contact">
    <p class="subtitle">Cuéntanos tu proyecto y te respondemos a la brevedad.</p>

    <div class="contact-form">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo">
      </div>
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="tu@correo.com">
      </div>
      <div class="form-group">
        <label for="proyecto">Proyecto</label>
        <textarea id="proyecto" placeholder="Describe tu proyecto o idea..."></textarea>
      </div>
      <button onclick="enviar()">Enviar Solicitud</button>
      <p class="success-msg" id="success">✅ ¡Mensaje enviado! Te contactaremos pronto.</p>
    </div>
  </section>

  <footer>
    <h3>SILIZ</h3>
    <p>© 2025-2026 Reimaginando lo Imposible</p>
  </footer>

  <script>
    function enviar() {
      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const proyecto = document.getElementById('proyecto').value.trim();
      if (!nombre || !correo || !proyecto) { alert('Por favor completa todos los campos.'); return; }
      document.getElementById('success').style.display = 'block';
      document.getElementById('nombre').value = '';
      document.getElementById('correo').value = '';
      document.getElementById('proyecto').value = '';
    }
  </script>

</body>
</html>
